name: Build and Publish Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    name: Build Packages and APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        id: build_apk
        continue-on-error: true
        run: |
          cd android_app
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          
          # Package macOS App
          zip -r ./release-assets/SpatialSight-macOS.zip mac_app/ -x "mac_app/__pycache__/*" "mac_app/**/__pycache__/*" "mac_app/venv/*"
          
          # Package Windows App
          zip -r ./release-assets/SpatialSight-Windows.zip windows_app/ -x "windows_app/__pycache__/*" "windows_app/**/__pycache__/*" "windows_app/venv/*"
          
          # If APK was built, copy it; otherwise zip Android source
          if [ -f "android_app/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android_app/app/build/outputs/apk/debug/app-debug.apk ./release-assets/SpatialSight-Android-v1.0.0.apk
          else
            echo "APK build failed or skipped, packaging Android source"
            zip -r ./release-assets/SpatialSight-Android-Source.zip android_app/ -x "android_app/.gradle/*" "android_app/**/build/*"
          fi
          
          ls -la ./release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: SpatialSight ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          body: |
            ## SpatialSight Releases for All Devices

            Download the package for your device:

            * **Android Phone:** Download `SpatialSight-Android-v1.0.0.apk` (or `SpatialSight-Android-Source.zip` for Android Studio).
            * **macOS (Apple Silicon M1-M5):** Download `SpatialSight-macOS.zip`, extract, and open the included `SpatialSight.app`.
            * **Windows PC:** Download `SpatialSight-Windows.zip`, extract, then double-click `SpatialSight.bat`.
          files: ./release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
